# ============================================================================
# Agent ToDo · nginx 站点配置
# ----------------------------------------------------------------------------
# 目标路径：/etc/nginx/conf.d/agenttodo.conf
# 启用：    OpenCloudOS 的 nginx 只 include conf.d/*.conf，**没有 sites-enabled/**
#           ⇒ 直接放 conf.d 即可，别做软链（软链过去会静默不生效）
# 校验：    nginx -t && systemctl reload nginx
# 发布官网：_dev_tools/push_site.py（推到 /srv/agenttodo/site/）
#
# ★ 本文件是**新增的 server 块**，与同实例上「彩票小助手」的 api.example.com
#   各管各的 vhost，互不影响 —— 这也是"新购独立实例"之外的第二道隔离。
#
# ★★ 三个「漏改就静默出错」的点，改这个文件时逐个对照：
#   ① `client_max_body_size 4m` —— 音频应用层上限 3 MB ⇒ nginx 必须 ≥ 3 MB。
#      **漏改的表现是语音上传直接 413，而小程序侧只看到"识别失败"，看不出原因。**
#   ② `ssl_protocols` 必须含 TLSv1.2 及以上 —— 微信小程序硬要求（C-2）。
#   ③ 域名根目录的**校验文件必须能直接返回文本**，不能被 301 跳走
#      —— 所以 80 那个 server 块里得给校验文件单独留一条 location。
#
# ★ 全文件**不 include 任何自定义 snippet** —— 首次部署要照做的步骤已经够多了，
#   少一层"某个文件不存在导致 nginx -t 失败"的隐性依赖。
# ============================================================================

# ---------------------------------------------------------------------------
# 限流区
# `limit_req_zone` 只能出现在 http 上下文。本文件由 nginx.conf 的
# `include sites-enabled/*;` 引入，正处于 http 上下文，所以写在这里是合法的。
# ---------------------------------------------------------------------------
# $binary_remote_addr 比 $remote_addr 省一半共享内存
limit_req_zone $binary_remote_addr zone=agenttodo_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=agenttodo_asr:10m   rate=20r/m;
# 其余接口给一档宽松的总闸，防"某个脚本把连接打满"
limit_req_zone $binary_remote_addr zone=agenttodo_api:10m   rate=300r/m;

# ===========================================================================
# 80 —— 只做两件事：放行校验文件，其余全部 301 到 https
# ===========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name todo.example.com;

    # ① certbot 的 HTTP-01 挑战目录（webroot 模式续期要用到）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # ② 微信小程序「业务域名 / 服务器域名」的校验文件
    #    ★★ 它必须**直接返回文本**、且**不能被 301**。全站跳转会让微信抓不到内容，
    #       报的错是"校验文件无法访问"，极容易被误会成服务器挂了。
    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /srv/agenttodo/verify;
        default_type text/plain;
        try_files $uri =404;
    }

    # 其余一律跳 https（C-2：只暴露 443 业务面）
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===========================================================================
# 443 —— 业务面
# ===========================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name todo.example.com;

    # ------------------------------------------------------------ 证书
    # ★ 路径必须与 certbot 实际产出一致（`certbot --nginx` 会自动写对；
    #   若用 `--webroot` 则需自己确认域名目录名）。
    # ★★ 配完**立刻**验证自动续期 —— 现网另一个实例就踩过：
    #      certbot.timer 是 `not-found`、证书到期无人续，到期后症状像"服务器挂了"
    #      （技术文档 N-1）。两条命令：
    #        systemctl enable --now certbot.timer
    #        certbot renew --dry-run
    ssl_certificate     /etc/letsencrypt/live/todo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo.example.com/privkey.pem;

    # ★ 微信小程序要求 TLS 1.2 及以上。显式写死，避免跟随系统默认降到 1.0/1.1
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS 先留注释：确认所有子域都上了 https 再开，否则会把自己锁在门外
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ------------------------------------------------------------ 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # ------------------------------------------------------------ 上传体积
    # ★★ 铁律：图片应用层 1 MB、音频应用层 3 MB ⇒ 这里必须 ≥ 3 MB，取 4m。
    #    （技术文档 §6.8.1 约束 4 的"三道设限"：nginx / multer / 应用层）
    client_max_body_size 4m;
    # 慢网下让 nginx 先把 body 收完再转给后端，避免 Node 进程一直挂着半截连接
    client_body_timeout     60s;
    client_body_buffer_size 256k;

    # ------------------------------------------------------------ 图片直出
    # ★ 图片**不经 Node**，由 nginx 直接读盘（§3.1）：
    #   · 省掉每个请求的 JS 开销（2 GB 机器上这是实打实的内存）
    #   · 拿得到 sendfile 与强缓存的好处
    # ★★ `alias` 的路径必须与 .env 里的 `UPLOAD_DIR` **逐字一致**（现为 /data/uploads）。
    # ⚠️ `alias` 结尾那条斜杠不能少 —— 少了是经典坑，映射出来的路径会不对。
    # ★ 库里的文件名是服务端生成的 12 字节随机 hex、内容永不变 ⇒ 可以放心强缓存。
    location /files/ {
        alias /data/uploads/;
        autoindex off;      # ★ 不列目录
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # ★ "上传目录不可执行"这一条，靠的是这个 location **不配任何 CGI/fastcgi**
        #   —— 不要在这里 include 任何 php / fcgi 配置。
        # ★ 类型嗅探必须关掉（否则有人塞个 .html 进去能被执行脚本，见 §7.4 第 6 条）
        add_header X-Content-Type-Options nosniff always;
    }

    # ------------------------------------------------------------ 健康检查
    # 给监控 / 运维用。★ 放在 /api/ 之前，避免被总闸限流误伤
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ------------------------------------------------------------ 登录（限流最严）
    # 防爆破（§7.4 第 9 条）。10 次/分钟对正常用户绰绰有余 ——
    # 小程序只在 token 过期时登录一次。
    location = /api/v1/auth/login {
        limit_req zone=agenttodo_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------ 语音识别
    # ★ 单独一档限流：腾讯云的 30 次/秒是**账号级**限频，免费额度只有 5000 次/月
    #   ⇒ 这里挡一道，应用层的按人日配额（ASR_DAILY_LIMIT）再挡一道（铁律三）。
    location = /api/v1/asr {
        limit_req zone=agenttodo_asr burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 一句话识别是同步接口，正常 1–3 秒；给 30 秒足够，别让连接挂太久
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ------------------------------------------------------------ 其余 API
    location /api/ {
        limit_req zone=agenttodo_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ------------------------------------------------------------ 微信校验文件
    # ★ 与 80 那块同源，但这里也放一条：微信「业务域名」校验走的是 **https**
    #   （web-view 只认 https）。只在 80 放会让校验报"文件无法访问"，很难归因。
    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /srv/agenttodo/verify;
        default_type text/plain;
        try_files $uri =404;
    }

    # ------------------------------------------------------------ 官网（纯静态）
    # ★ 站点根目录：/srv/agenttodo/site/（index.html ＋ img/，共 35 个文件，约 5.8 MB）
    #   发布方式：`_dev_tools/push_site.py` 打 tar.gz → TAT 分块 → sha256 一致才解包。
    #   ⚠️ 换版时**先解到 site.new 再原子 mv**，不要在 site/ 里就地覆盖 ——
    #      中途半截的目录会让访问者看到缺图的页面。
    # ★ 图片单独一条（正则优先于前缀匹配）：文件名带内容语义、换版必改名 ⇒ 可长缓存。
    location ~* ^/img/[A-Za-z0-9._-]+\.(?:jpg|jpeg|png|gif|svg|webp|ico)$ {
        root /srv/agenttodo/site;
        expires 30d;
        access_log off;
    }

    # HTML 每次回源校验：内容是随发布变的，别让用户看到上一个版本
    location = /index.html {
        root /srv/agenttodo/site;
        expires -1;
    }

    # 站点其余路径走静态；`=404` 而不是回落到 index.html ——
    # 本站是锚点式单页，不存在前端路由，回落只会把 404 伪装成 200。
    location / {
        root  /srv/agenttodo/site;
        index index.html;
        try_files $uri $uri/ =404;
        expires -1;
    }
}
